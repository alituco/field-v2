<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Fieldrush sign-in code</title></head>
  <body style="margin:0;background:#faf7ef;color:#213020;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:40px auto;padding:32px;background:#fff;border:1px solid #e5dfcc;border-radius:24px">
      <div style="font-size:15px;letter-spacing:2px;font-weight:700;color:#386541">FIELDRUSH</div>
      <h1 style="font-size:28px;margin:24px 0 16px">Your sign-in code</h1>
      <p style="color:#596b51;line-height:1.6">Enter this 6-digit code on the Fieldrush sign-in screen:</p>
      <div style="margin:24px 0;padding:20px;background:#f2f0e5;border-radius:16px;text-align:center;font-size:36px;font-weight:700;letter-spacing:8px">{{ .Token }}</div>
      <p style="color:#596b51;line-height:1.6">This code expires in 10 minutes. Do not share it with anyone.</p>
      <p style="color:#596b51;font-size:13px;line-height:1.6">If you did not request this code, you can ignore this email.</p>
    </div>
  </body>
</html>
