name: Staging Android emulator
description: Shared, disk-guarded Android runtime for preflight and hosted E2E
inputs:
  script:
    description: Command to run after Android has booted
    required: true
runs:
  using: composite
  steps:
    - name: Enable KVM for the Android emulator
      shell: bash
      run: |
        set -euo pipefail
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo udevadm settle
        # Udev delivery can race this step on hosted VMs. Set the disposable
        # device permissions explicitly before testing or starting QEMU.
        sudo chmod 666 /dev/kvm
        test -r /dev/kvm && test -w /dev/kvm

    - name: Boot Android and run the supplied check
      uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
      with:
        api-level: 34
        target: aosp_atd
        arch: x86_64
        profile: pixel_2
        cores: 2
        ram-size: 2048M
        heap-size: 512M
        disk-size: 2048M
        disable-animations: true
        emulator-boot-timeout: 300
        pre-emulator-launch-script: bash "$GITHUB_WORKSPACE/.github/scripts/prepare-android-emulator.sh"
        emulator-options: >-
          -no-window
          -gpu swiftshader_indirect
          -feature -Vulkan
          -no-snapshot
          -noaudio
          -no-boot-anim
          -no-metrics
          -camera-back none
        script: ${{ inputs.script }}
