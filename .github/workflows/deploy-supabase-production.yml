name: Deploy Supabase production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PRODUCTION to confirm the release
        required: true
        type: string
      backup_confirmation:
        description: Type BACKUP_VERIFIED after checking production backup/PITR
        required: true
        type: string
      payment_confirmation:
        description: Type LIVE_STRIPE_READY after configuring live Stripe and the coordinated mobile/admin release
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy production functions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    env:
      SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      OTHER_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_URL: https://${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      FIELD_ENVIRONMENT: production
      DEPLOY_RECORDING_FUNCTIONS: ${{ vars.DEPLOY_RECORDING_FUNCTIONS }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
      PRODUCTION_STRIPE_LIVE_ROLLOUT: ${{ inputs.payment_confirmation }}
      STRIPE_ACCOUNT_ID: ${{ vars.STRIPE_ACCOUNT_ID }}
      STRIPE_WEBHOOK_ENDPOINT_ID: ${{ vars.STRIPE_WEBHOOK_ENDPOINT_ID }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require successful CI and the full verified staging release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/verify-production-backend-release.mjs

      - name: Verify production target and confirmation
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/prod" ]]; then
            echo "::error::Production deployments must be dispatched from the prod branch."
            exit 1
          fi
          if [[ "$DEPLOY_CONFIRMATION" != "DEPLOY_PRODUCTION" ]]; then
            echo "::error::Production confirmation did not match DEPLOY_PRODUCTION."
            exit 1
          fi
          if [[ "$BACKUP_CONFIRMATION" != "BACKUP_VERIFIED" ]]; then
            echo "::error::Confirm the production backup/PITR check with BACKUP_VERIFIED."
            exit 1
          fi
          if [[ "$PRODUCTION_STRIPE_LIVE_ROLLOUT" != "LIVE_STRIPE_READY" ]]; then
            echo "::error::Confirm the coordinated live Stripe rollout with LIVE_STRIPE_READY."
            exit 1
          fi
          if [[ -z "$SUPABASE_PROJECT_REF" || -z "$OTHER_SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Configure both Supabase project-ref repository variables."
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_REF" == "$OTHER_SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Production and staging cannot use the same Supabase project."
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_REF" != "zjsjuuhborxrlmdcpvlj" || "$OTHER_SUPABASE_PROJECT_REF" != "nfdkdhdevpstfspazbfn" ]]; then
            echo "::error::The configured project refs are not Field Production and Field Staging."
            exit 1
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::The production GitHub environment is missing Supabase secrets."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Deploy production database and production-safe functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_RECONCILE_SECRET: ${{ secrets.STRIPE_RECONCILE_SECRET }}
        run: .github/scripts/deploy-supabase.sh production "$SUPABASE_PROJECT_REF"

      - name: Smoke-test hosted production
        run: node .github/scripts/smoke-supabase.mjs
