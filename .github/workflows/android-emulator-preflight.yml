name: Android emulator preflight

on:
  pull_request:
    branches: [staging]
    paths:
      - .github/actions/staging-android-emulator/**
      - .github/scripts/*android*
      - .github/workflows/ci.yml
      - .github/workflows/android-emulator-preflight.yml
      - mobile/test_driver/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: Android emulator boots and stays online
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Flutter like the E2E runtime
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Test disk safety and runner commands
        run: node --test .github/scripts/*android*.test.mjs

      # No staging secrets or hosted database access. Uses exactly the same
      # composite action as the protected journey, before a PR is merged.
      - name: Boot and exercise the real GitHub emulator
        uses: ./.github/actions/staging-android-emulator
        with:
          script: |
            set -euo pipefail
            test "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1
            for attempt in {1..12}; do
              test "$(adb -s "$ANDROID_SERIAL" get-state | tr -d '\r')" = device
              adb -s "$ANDROID_SERIAL" shell input keyevent KEYCODE_HOME
              sleep 5
            done
            df -h /
            echo "Android booted and remained online for the runtime check."
