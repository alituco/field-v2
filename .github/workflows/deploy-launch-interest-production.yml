name: Production interest collection

on:
  pull_request:
    branches: [prod]
    paths:
      - .github/workflows/deploy-launch-interest-production.yml
      - .github/scripts/deploy-launch-interest*
      - .github/scripts/verify-launch-interest-release.mjs
      - supabase/migrations/20261012000600_capture_fieldrush_launch_interest.sql
      - supabase/scripts/launch_interest_release_fixture.sql
      - supabase/scripts/verify_launch_interest.sql
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_INTEREST_ONLY to release website signups only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-interest-${{ github.event_name == 'workflow_dispatch' && 'release' || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify isolated interest release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: interest_release_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: interest_release_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check release guards and encrypted backups
        run: node --test .github/scripts/deploy-launch-interest.test.mjs
      - name: Verify the minimum production predecessor schema
        run: node .github/scripts/verify-launch-interest-release.mjs

  deploy:
    name: Enable production website interest collection
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    environment:
      name: production
      url: https://www.field.bh
    env:
      EXPECTED_PROJECT_REF: zjsjuuhborxrlmdcpvlj
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Require successful CI for this production commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=prod&head_sha=${GITHUB_SHA}&status=completed&per_page=30" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$passed" -ge 1 || { echo 'This exact production commit must pass CI first.' >&2; exit 1; }
      - name: Back up, apply only interest collection, and verify
        env:
          BACKUP_PATH: ${{ runner.temp }}/launch-interest-${{ github.run_id }}-${{ github.run_attempt }}.enc
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node .github/scripts/deploy-launch-interest.mjs --apply
      - name: Retain encrypted interest backup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-interest-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launch-interest-${{ github.run_id }}-${{ github.run_attempt }}.enc
          if-no-files-found: ignore
          retention-days: 30
