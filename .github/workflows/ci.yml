name: CI

on:
  pull_request:
    branches:
      - staging
      - prod
  push:
    branches:
      - staging
      - prod
  workflow_dispatch:
    inputs:
      mode:
        description: "Staging diagnostic scope (never publishes TestFlight or the PWA)"
        required: true
        default: full
        type: choice
        options:
          - full
          - backend
          - player
          - journey

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a staging migration midway through a deploy. Pull-request
  # and production checks can still be superseded by newer runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

jobs:
  preflight:
    name: Fast CI contracts and change plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.plan.outputs.flutter }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      referee: ${{ steps.plan.outputs.referee }}
      broadcaster: ${{ steps.plan.outputs.broadcaster }}
      database: ${{ steps.plan.outputs.database }}
      backend: ${{ steps.plan.outputs.backend }}
      player: ${{ steps.plan.outputs.player }}
      browser: ${{ steps.plan.outputs.browser }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          fetch-depth: 0
      - name: Test deployment and workflow contracts before expensive jobs
        run: bash .github/scripts/check-ci.sh
      - name: Select checks and staging diagnostic scope
        id: plan
        env:
          CI_MODE: ${{ inputs.mode || 'full' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-plan.mjs

  flutter:
    name: Flutter analyze and test
    needs: preflight
    if: needs.preflight.outputs.flutter == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        id: flutter-tests
        run: flutter test

      - name: Upload Flutter golden failure images
        if: failure() && steps.flutter-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: flutter-golden-failures-${{ runner.os }}
          path: mobile/test/failures/*.png
          if-no-files-found: ignore
          retention-days: 7

  android-builds:
    name: Flutter Android flavor builds
    needs: preflight
    if: needs.preflight.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
      - name: Reserve disk space for Android builds
        working-directory: .
        run: bash .github/scripts/prepare-android-runner.sh
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android staging flavor
        run: >-
          flutter build apk
          --debug
          --flavor staging
          --dart-define=APP_ENV=staging
          --dart-define=SUPABASE_URL=https://nfdkdhdevpstfspazbfn.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-placeholder
          --dart-define=DEV=true
          --dart-define=PROFILE_SWITCHER_ENABLED=true
          --dart-define=EMAIL_DELIVERY_ENABLED=true

      - name: Build Android production flavor
        run: >-
          flutter build apk
          --release
          --flavor production
          --dart-define=APP_ENV=production
          --dart-define=SUPABASE_URL=https://zjsjuuhborxrlmdcpvlj.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-placeholder
          --dart-define=DEV=false
          --dart-define=PROFILE_SWITCHER_ENABLED=false
          --dart-define=EMAIL_DELIVERY_ENABLED=false

  flutter-ios:
    name: Flutter iOS flavor builds
    needs: preflight
    if: needs.preflight.outputs.ios == 'true'
    runs-on: macos-26
    # Cold simulator and device builds share this budget; macOS runner variance
    # can use 28 minutes for the simulator alone. Keep both flavors mandatory.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Require Xcode 26 for Stripe SDK builds
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/^Xcode / {split($2, version, "."); print version[1]}')"
          if [[ -z "$xcode_major" || "$xcode_major" -lt 26 ]]; then
            echo "::error::The Stripe iOS SDK requires Xcode 26 or newer."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate iOS privacy purpose strings
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint ios/Runner/Info.plist
          camera_description="$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' ios/Runner/Info.plist)"
          if [[ -z "${camera_description//[[:space:]]/}" ]]; then
            echo "::error::NSCameraUsageDescription must explain why Field may access the camera."
            exit 1
          fi

      - name: Build iOS staging simulator flavor
        run: >-
          flutter build ios
          --simulator
          --debug
          --flavor staging
          --dart-define=APP_ENV=staging
          --dart-define=SUPABASE_URL=https://nfdkdhdevpstfspazbfn.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-placeholder
          --dart-define=DEV=true
          --dart-define=PROFILE_SWITCHER_ENABLED=true
          --dart-define=EMAIL_DELIVERY_ENABLED=true

      - name: Build iOS production release flavor
        run: >-
          flutter build ios
          --release
          --no-codesign
          --flavor production
          --dart-define=APP_ENV=production
          --dart-define=SUPABASE_URL=https://zjsjuuhborxrlmdcpvlj.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-placeholder
          --dart-define=DEV=false
          --dart-define=PROFILE_SWITCHER_ENABLED=false
          --dart-define=EMAIL_DELIVERY_ENABLED=false

  referee:
    name: Referee web checks
    needs: preflight
    if: needs.preflight.outputs.referee == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: referee
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-only values. CI must not connect to either hosted Supabase project.
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SUPABASE_URL: https://nfdkdhdevpstfspazbfn.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-secret
      CLOUDFLARE_ACCOUNT_ID: ci-placeholder
      CLOUDFLARE_STREAM_API_TOKEN: ci-placeholder-not-a-secret
      CLOUDFLARE_STREAM_CUSTOMER_CODE: customer-ci-placeholder.example
      BROADCAST_AGENT_TOKEN: ci-placeholder-not-a-secret
      BROADCAST_OVERLAY_TOKEN: ci-placeholder-not-a-secret
      BROADCAST_DEVICE_KEY: ci-main-pitch
      BROADCAST_DEVICE_NAME: CI Main Pitch

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (Node 24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: referee/package-lock.json

      - name: Install referee dependencies
        run: npm ci

      - name: Type-check referee app
        run: npm run typecheck

      - name: Run referee tests
        run: npm test

      - name: Install Chromium for isolated admin navigation checks
        run: npx playwright install --with-deps chromium

      - name: Check admin inbox navigation before hosted journeys
        run: npm run test:ui -- admin-inbox-navigation.spec.ts admin-cities.spec.ts admin-seasons.spec.ts referee-finalization-diagnostics.spec.ts referee-assigned-games.spec.ts season-zero-operations.spec.ts broadcaster-pairing.spec.ts broadcaster-desktop.spec.ts admin-game-bots.spec.ts broadcast-scoreboard.spec.ts --project=chromium

      - name: Build referee app
        run: npm run build

  broadcaster:
    name: Broadcaster checks
    needs: preflight
    if: needs.preflight.outputs.broadcaster == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: broadcaster

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (Node 24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: broadcaster/package-lock.json

      - name: Install broadcaster dependencies
        run: npm ci

      - name: Syntax-check broadcaster agent
        run: |
          node --check src/index.mjs
          node --check src/desktop/main.mjs
          node --check src/desktop/preload.cjs
          node --check src/desktop/app.js
          npm test

  database:
    name: Supabase schema and behavior
    needs: preflight
    if: needs.preflight.outputs.database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      # The prefetch stage caches these exact names for the pinned CLI.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      # config.toml references these values, but the corresponding local
      # integrations are disabled. These are deliberately non-secret values.
      OPENAI_API_KEY: ci-placeholder
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-placeholder
      S3_HOST: ci-placeholder
      S3_REGION: ci-placeholder
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Set up Node.js for isolated database tools
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (Node 24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: referee/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.8.2

      - name: Check Edge Functions and database verifier
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' script_files < <(
            find supabase/scripts -type f -name '*.ts' -print0
          )
          deno fmt --check supabase/functions "${script_files[@]}"
          deno check supabase/functions/*/index.ts "${script_files[@]}"
          deno test \
            supabase/functions/_shared/stripe_checkout_test.ts \
            supabase/functions/_shared/stripe_staging_fixture_test.ts \
            supabase/functions/_shared/stripe_recovery_test.ts \
            supabase/functions/_shared/stripe_reconcile_test.ts \
            supabase/functions/_shared/stripe_resume_test.ts \
            supabase/functions/_shared/staging_guard_test.ts \
            supabase/functions/_shared/dev_auth_test.ts \
            supabase/functions/fieldrush-delete-account/request_test.ts \
            supabase/functions/dev-switch-user/fixture_test.ts \
            supabase/functions/_shared/staging_admin_session_test.ts \
            supabase/functions/fieldrush-push-dispatch/handler_test.ts \
            supabase/functions/cloudflare-stream-webhook/replay_test.ts \
            supabase/scripts/_shared/environment_guard_test.ts \
            supabase/scripts/e2e/_shared_test.ts \
            supabase/scripts/e2e/rating_tracks_test.ts \
            supabase/scripts/e2e/checkouts_test.ts
          deno test supabase/scripts/e2e/game_slots_test.ts supabase/scripts/e2e/completion_evidence_test.ts

      - name: Check Phoenix rules, wallets, leaderboards, fields, schedules, and price changes
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/fieldrush-market-sql-tools" \
            --no-package-lock --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_fieldrush_market.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_fieldrush_leaderboard.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_saved_fields.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_game_schedules.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_solo_schedule_timezone_validation.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_game_prices.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_single_active_game.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_home_activity_dismissals.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_e2e_checkout_cleanup.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_unpaid_legacy_checkout_repair.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_e2e_captured_checkout_reconciliation.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_game_division_ranges.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_game_formations.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_staging_game_bots.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_solo_rebooking.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_staff_provisioning.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_notification_push_delivery.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_notification_events.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_push_dispatch_schedule.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_stripe_checkout_recovery.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_paired_broadcasters.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_broadcast_recording_recovery.mjs
          PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite" \
            node supabase/scripts/test_profile_clip_recommendations.mjs

      - name: Replay the account and push migration chain without provider access
        shell: bash
        run: |
          set -euo pipefail
          export PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite"
          THROUGH_MIGRATION=20261016000600 \
            REPLAY_SQL_FILE=supabase/scripts/verify_reliability_policy_system.sql \
            node supabase/scripts/test_season_zero_migration_chain.mjs
          THROUGH_MIGRATION=20261016000600 \
            REPLAY_SQL_FILE=supabase/scripts/verify_push_priority.sql \
            node supabase/scripts/test_season_zero_migration_chain.mjs
          THROUGH_MIGRATION=20261016000600 \
            REPLAY_SQL_FILE=supabase/scripts/verify_legacy_solo_resume.sql \
            node supabase/scripts/test_season_zero_migration_chain.mjs

      - name: Verify prospective Season 0 rating math, evidence, replay, privacy, and transfers
        shell: bash
        run: |
          set -euo pipefail
          export PGLITE_MODULE="$RUNNER_TEMP/fieldrush-market-sql-tools/node_modules/@electric-sql/pglite"
          node supabase/scripts/test_season_zero_sr_calculator.mjs
          node supabase/scripts/test_season_zero_rating_initialization.mjs
          node supabase/scripts/test_season_zero_sr_timeline.mjs
          node supabase/scripts/test_season_zero_match_evidence.mjs
          node supabase/scripts/test_season_zero_sr_settlement.mjs
          node supabase/scripts/test_lifetime_rating_visibility.mjs
          node supabase/scripts/test_player_rating_read_cost.mjs
          node supabase/scripts/test_season_zero_rebalance.mjs
          node supabase/scripts/test_season_zero_migration_chain.mjs

      - name: Authenticate read-only container downloads
        shell: bash
        env:
          GHCR_PULL_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Download local Supabase images before schema initialization
        run: node .github/scripts/prefetch-ci-supabase-images.mjs

      - name: Replay migrations on a fresh local Supabase stack
        run: node .github/scripts/start-ci-supabase.mjs

      - name: Lint the local database
        run: supabase db lint --local --level error

      - name: Show local migration status
        run: supabase migration list --local

      - name: Verify privacy RPC transaction contracts and real party context
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            <supabase/scripts/verify_rating_privacy_rpc_volatility.sql

      - name: Verify Fieldrush account security and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c BEGIN -f /dev/stdin -c ROLLBACK \
            <supabase/scripts/verify_fieldrush_accounts.sql
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c BEGIN -f /dev/stdin -c ROLLBACK \
            <supabase/scripts/verify_fieldrush_google_email.sql
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c BEGIN -f /dev/stdin -c ROLLBACK \
            <supabase/scripts/verify_safe_staff_provisioning.sql
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            <supabase/scripts/verify_staging_game_bots.sql
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c BEGIN -f /dev/stdin -c ROLLBACK \
            <supabase/scripts/verify_notification_push_security.sql
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c BEGIN -f /dev/stdin -c ROLLBACK \
            <supabase/scripts/verify_notification_events.sql
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c BEGIN -f /dev/stdin -c ROLLBACK \
            <supabase/scripts/verify_clan_write_containment.sql
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c BEGIN -f /dev/stdin -c ROLLBACK \
            <supabase/scripts/verify_replacement_notifications.sql
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            <supabase/scripts/verify_atomic_solo_goals.sql
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c BEGIN -f /dev/stdin -c ROLLBACK \
            <supabase/scripts/verify_push_priority.sql
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c BEGIN -f /dev/stdin -c ROLLBACK \
            <supabase/scripts/verify_legacy_solo_resume.sql

      - name: Verify injury evidence for audited early solo matches
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i supabase_db_field_v2 \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c BEGIN -f /dev/stdin -c ROLLBACK \
            <supabase/scripts/verify_audited_early_match_injuries.sql

      - name: Verify staff offboarding and atomic account-deletion wallet forfeiture
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i supabase_db_field_v2 \
