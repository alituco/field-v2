  backend-staging:
    name: Deploy and smoke-test staging backend
    needs: [preflight, flutter, database]
    if: >-
      always() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.backend == 'true' &&
      (needs.flutter.result == 'success' ||
        (inputs.mode == 'backend' && needs.flutter.result == 'skipped')) &&
      (needs.database.result == 'success' ||
        (inputs.mode == 'backend' && needs.database.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
    env:
      SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      OTHER_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_URL: https://${{ vars.STAGING_SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      FIELD_ENVIRONMENT: staging
      E2E_CONFIRM_TARGET: FIELD_STAGING_E2E
      E2E_BOOTSTRAP_PHONE: "+97339009098"
      E2E_DEV_OTP_CODE: "000000"
      E2E_ONBOARDING_PHONE: "+97339009100"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_ENDPOINT_ID: ${{ vars.STRIPE_WEBHOOK_ENDPOINT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Verify staging target
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_RECONCILE_SECRET: ${{ secrets.STRIPE_RECONCILE_SECRET }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/staging" ]]; then
            echo "::error::Staging deployments must run from the staging branch."
            exit 1
          fi
          if [[ -z "$SUPABASE_PROJECT_REF" || -z "$OTHER_SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Configure both Supabase project-ref repository variables."
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_REF" == "$OTHER_SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Staging and production cannot use the same Supabase project."
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_REF" != "nfdkdhdevpstfspazbfn" || "$OTHER_SUPABASE_PROJECT_REF" != "zjsjuuhborxrlmdcpvlj" ]]; then
            echo "::error::The configured project refs are not Field Staging and Field Production."
            exit 1
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PUBLISHABLE_KEY" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "::error::The staging GitHub environment is missing Supabase credentials."
            exit 1
          fi
          if [[ "$STRIPE_SECRET_KEY" != sk_test_* || "$STRIPE_PUBLISHABLE_KEY" != pk_test_* || "$STRIPE_WEBHOOK_SECRET" != whsec_* || -z "$STRIPE_RECONCILE_SECRET" ]]; then
            echo "::error::The staging GitHub environment is missing Stripe sandbox/webhook/worker credentials."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Deploy staging database and functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_RECONCILE_SECRET: ${{ secrets.STRIPE_RECONCILE_SECRET }}
        run: .github/scripts/deploy-supabase.sh staging "$SUPABASE_PROJECT_REF"

      - name: Smoke-test hosted staging
        run: node .github/scripts/smoke-supabase.mjs

  prepare-staging-e2e:
    name: Prepare and build staging player E2E
    needs: [preflight, backend-staging]
    if: needs.preflight.outputs.player == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      handoff-artifact-id: ${{ steps.handoff-upload.outputs.artifact-id }}
    environment:
      name: staging
    env:
      SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_URL: https://${{ vars.STAGING_SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      FIELD_ENVIRONMENT: staging
      E2E_CONFIRM_TARGET: FIELD_STAGING_E2E
      E2E_BOOTSTRAP_PHONE: "+97339009098"
      E2E_DEV_OTP_CODE: "000000"
      E2E_ONBOARDING_PHONE: "+97339009100"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      # Jobs do not share installed tools. Auth configuration below still
      # calls the CLI even though deployment now runs on a different runner.
      - name: Set up Supabase CLI for E2E authentication
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Verify the E2E authentication CLI before native tooling setup
        run: supabase --version

      - name: Reserve disk space for Android E2E
        run: bash .github/scripts/prepare-android-runner.sh

      - name: Set up Java for Android E2E
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter for Android E2E
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Set up Deno for E2E fixtures
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.8.2

      - name: Prepare isolated staging E2E run
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          {
            echo "E2E_RUN_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "E2E_TEST_PASSWORD=$password"
            echo "E2E_MANIFEST_PATH=$RUNNER_TEMP/field-e2e-manifest.json"
          } >>"$GITHUB_ENV"
          mkdir -p \
            "$GITHUB_WORKSPACE/mobile/build/e2e-artifacts" \
            "$GITHUB_WORKSPACE/referee/e2e-artifacts"

      - name: Install player E2E dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Create isolated staging E2E fixtures
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          deno run
          --allow-env
          --allow-net
          --allow-write
          supabase/scripts/e2e/setup_staging.ts

      - name: Configure and verify staging E2E authentication
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: .github/scripts/configure-staging-e2e-auth.sh

      - name: Export non-secret E2E fixture identifiers
        shell: bash
        run: |
          set -euo pipefail
          test -s "$E2E_MANIFEST_PATH"
          {
            echo "E2E_MAIN_PHONE=$(jq -r '.accounts.main.phone' "$E2E_MANIFEST_PATH")"
            echo "E2E_MAIN_PROFILE_ID=$(jq -r '.accounts.main.profileId' "$E2E_MANIFEST_PATH")"
            echo "E2E_PARTY_TARGET_PHONE=$(jq -r '.accounts.partyTarget.phone' "$E2E_MANIFEST_PATH")"
            echo "E2E_PARTY_TARGET_PROFILE_ID=$(jq -r '.accounts.partyTarget.profileId' "$E2E_MANIFEST_PATH")"
            echo "E2E_ADMIN_PHONE=$(jq -r '.accounts.admin.phone' "$E2E_MANIFEST_PATH")"
            echo "E2E_ONBOARDING_PROFILE_ID=$(jq -r '.accounts.onboarding.profileId' "$E2E_MANIFEST_PATH")"
            echo "E2E_MATCH_GAME_ID=$(jq -r '.games.match.id' "$E2E_MANIFEST_PATH")"
            echo "E2E_CANCELLATION_GAME_ID=$(jq -r '.games.cancellation.id' "$E2E_MANIFEST_PATH")"
            echo "E2E_REPORT_DETAILS=$(jq -r '.markers.reportDetails' "$E2E_MANIFEST_PATH")"
            echo "E2E_SUPPORT_DETAILS=$(jq -r '.markers.supportDetails' "$E2E_MANIFEST_PATH")"
          } >>"$GITHUB_ENV"

      - name: Verify prepared staging E2E fixtures
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          deno run
          --allow-env
          --allow-net
          --allow-read
          supabase/scripts/e2e/verify_staging.ts
          --phase=prepared

      - name: Prebuild staging player journey
        timeout-minutes: 15
        run: bash .github/scripts/run-staging-android-e2e.sh build-only

      - name: Encrypt E2E handoff for fresh runners
        id: handoff
        if: always() && env.E2E_MANIFEST_PATH != ''
        shell: bash
        env:
          STAGING_E2E_HANDOFF_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! -s "$E2E_MANIFEST_PATH" ]]; then
            echo "No manifest exists; there are no fixtures to hand off."
            exit 0
          fi
          payload_dir="$RUNNER_TEMP/field-e2e-payload"
          mkdir -m 700 "$payload_dir"
          cp "$E2E_MANIFEST_PATH" "$payload_dir/manifest.json"
          printf '%s' "$E2E_TEST_PASSWORD" >"$payload_dir/password.txt"
          apk="$GITHUB_WORKSPACE/mobile/build/app/outputs/flutter-apk/app-staging-debug.apk"
          if [[ -s "$apk" ]]; then
            cp "$apk" "$payload_dir/player-journey.apk"
          fi
          chmod 600 "$payload_dir"/*
          node .github/scripts/staging-e2e-handoff.mjs pack \
            --source-dir "$payload_dir" \
            --output "$RUNNER_TEMP/field-e2e-handoff.bin"
          echo "created=true" >>"$GITHUB_OUTPUT"

      - name: Transfer encrypted APK and fixture state
        id: handoff-upload
        if: always() && steps.handoff.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-e2e-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/field-e2e-handoff.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Clean up fixtures after preparation failure
        if: failure() || cancelled()
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          trap 'bash .github/scripts/close-staging-e2e-auth.sh' EXIT
          if [[ -n "${E2E_MANIFEST_PATH:-}" && -s "$E2E_MANIFEST_PATH" ]]; then
            deno run --allow-env --allow-net --allow-read \
              supabase/scripts/e2e/cleanup_staging.ts
          fi

  android-staging-e2e:
    name: Staging Android player E2E
    needs: [preflight, prepare-staging-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Set up Flutter for the prebuilt test driver
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Install test driver dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Download encrypted player APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare-staging-e2e.outputs.handoff-artifact-id }}
          path: ${{ runner.temp }}/field-e2e-download
          merge-multiple: true

      - name: Restore prebuilt player APK
        shell: bash
        env:
          STAGING_E2E_HANDOFF_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node .github/scripts/staging-e2e-handoff.mjs unpack \
            --file "$RUNNER_TEMP/field-e2e-download/field-e2e-handoff.bin" \
            --output-dir "$RUNNER_TEMP/field-e2e-restored"
          echo "E2E_MANIFEST_PATH=$RUNNER_TEMP/field-e2e-restored/manifest.json" >>"$GITHUB_ENV"
          test -s "$RUNNER_TEMP/field-e2e-restored/player-journey.apk"
          echo "E2E_APK_PATH=$RUNNER_TEMP/field-e2e-restored/player-journey.apk" >>"$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/field-e2e-restored/password.txt"

      # This fresh runner does not install Playwright, deploy Supabase, or
      # compile Android. Flutter drive installs the already-tested binary.
      - name: Run staging player journey on a fresh Android runner
        uses: ./.github/actions/staging-android-emulator
        with:
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run-staging-android-e2e.sh" run-prebuilt

      - name: Encrypt Android failure diagnostics
        id: android-diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        shell: bash
        env:
          STAGING_DIAGNOSTICS_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ ! -d mobile/build/e2e-artifacts ]]; then
            exit 0
          fi
          archive="$RUNNER_TEMP/field-android-diagnostics.tar.gz"
          trap 'rm -f "$archive"' EXIT
          tar -czf "$archive" -- mobile/build/e2e-artifacts
          node .github/scripts/staging-diagnostics.mjs encrypt \
            --input "$archive" \
            --output "$RUNNER_TEMP/field-android-diagnostics.bin" \
            --context "$GITHUB_RUN_ID:android"
          echo "created=true" >>"$GITHUB_OUTPUT"

      - name: Upload encrypted Android failure diagnostics
        if: always() && steps.android-diagnostics.outputs.created == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-android-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/field-android-diagnostics.bin
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Clean up failed or player-only diagnostic fixtures
        if: always() && (failure() || cancelled() || needs.preflight.outputs.browser != 'true')
        uses: ./.github/actions/cleanup-staging-e2e
        with:
          handoff-artifact-id: ${{ needs.prepare-staging-e2e.outputs.handoff-artifact-id }}
        env:
          STAGING_E2E_HANDOFF_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: https://${{ vars.STAGING_SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIELD_ENVIRONMENT: staging
          E2E_CONFIRM_TARGET: FIELD_STAGING_E2E

  browser-staging-e2e:
    name: Staging referee and admin E2E
    needs: [preflight, prepare-staging-e2e, android-staging-e2e]
    if: needs.preflight.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    # Includes the real 30-minute S0 match plus build, verification and cleanup.
    timeout-minutes: 55
    environment:
      name: staging
    env:
      SUPABASE_URL: https://${{ vars.STAGING_SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      FIELD_ENVIRONMENT: staging
      E2E_CONFIRM_TARGET: FIELD_STAGING_E2E
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Set up Node.js for referee E2E
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (Node 24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: referee/package-lock.json

      - name: Set up Deno for outcome verification
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.8.2

      - name: Download encrypted fixture state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare-staging-e2e.outputs.handoff-artifact-id }}
          path: ${{ runner.temp }}/field-e2e-download
          merge-multiple: true

      - name: Restore isolated E2E fixture state
        shell: bash
        env:
          STAGING_E2E_HANDOFF_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node .github/scripts/staging-e2e-handoff.mjs unpack \
            --file "$RUNNER_TEMP/field-e2e-download/field-e2e-handoff.bin" \
            --output-dir "$RUNNER_TEMP/field-e2e-restored"
          echo "E2E_MANIFEST_PATH=$RUNNER_TEMP/field-e2e-restored/manifest.json" >>"$GITHUB_ENV"
          password="$(cat "$RUNNER_TEMP/field-e2e-restored/password.txt")"
          echo "::add-mask::$password"
          {
            echo "E2E_TEST_PASSWORD=$password"
            echo "E2E_MANIFEST_PATH=$RUNNER_TEMP/field-e2e-restored/manifest.json"
          } >>"$GITHUB_ENV"
          mkdir -p referee/e2e-artifacts

      - name: Install referee E2E dependencies
        working-directory: referee
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: referee
        run: npx playwright install --with-deps chromium

      - name: Build staging referee app
        working-directory: referee
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_ENV: staging
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ci-placeholder
          CLOUDFLARE_STREAM_API_TOKEN: ci-placeholder-not-a-secret
          CLOUDFLARE_STREAM_CUSTOMER_CODE: customer-ci-placeholder.example
          BROADCAST_AGENT_TOKEN: ci-placeholder-not-a-secret
          BROADCAST_OVERLAY_TOKEN: ci-placeholder-not-a-secret
          BROADCAST_DEVICE_KEY: ci-main-pitch
          BROADCAST_DEVICE_NAME: CI Main Pitch
        run: npm run build

      - name: Start staging referee app
        shell: bash
        working-directory: referee
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_ENV: staging
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ci-placeholder
          CLOUDFLARE_STREAM_API_TOKEN: ci-placeholder-not-a-secret
          CLOUDFLARE_STREAM_CUSTOMER_CODE: customer-ci-placeholder.example
          BROADCAST_AGENT_TOKEN: ci-placeholder-not-a-secret
          BROADCAST_OVERLAY_TOKEN: ci-placeholder-not-a-secret
          BROADCAST_DEVICE_KEY: ci-main-pitch
          BROADCAST_DEVICE_NAME: CI Main Pitch
        run: |
          set -euo pipefail
          nohup npm start -- --hostname 127.0.0.1 --port 3000 \
            >e2e-artifacts/referee-server.log 2>&1 &
          echo "$!" >"$RUNNER_TEMP/field-referee-e2e.pid"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              "$PLAYWRIGHT_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The referee E2E server did not become ready."
          exit 1

      - name: Run referee and admin browser journey
        working-directory: referee
        run: npm run test:e2e

      - name: Verify staging E2E outcomes
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          deno run
          --allow-env
          --allow-net
          --allow-read
          supabase/scripts/e2e/verify_staging.ts
          --phase=complete

      - name: Stop staging referee app
        if: always()
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/field-referee-e2e.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/field-referee-e2e.pid")" || true
          fi

      # Traces contain Authorization headers and session state. Log masking does
      # not sanitize artifact contents, especially in a public repository.
      - name: Encrypt staging browser failure diagnostics
        id: browser-diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        shell: bash
        env:
          STAGING_DIAGNOSTICS_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          paths=()
          for directory in referee/e2e-artifacts referee/playwright-report referee/test-results; do
            if [[ -d "$directory" ]]; then
              paths+=("$directory")
            fi
          done
          if [[ ${#paths[@]} -eq 0 ]]; then
            exit 0
          fi
          archive="$RUNNER_TEMP/field-browser-diagnostics.tar.gz"
          trap 'rm -f "$archive"' EXIT
          tar -czf "$archive" -- "${paths[@]}"
          node .github/scripts/staging-diagnostics.mjs encrypt \
            --input "$archive" \
            --output "$RUNNER_TEMP/field-browser-diagnostics.bin" \
            --context "$GITHUB_RUN_ID:browser"
          echo "created=true" >>"$GITHUB_OUTPUT"

      - name: Upload encrypted staging browser failure diagnostics
        if: always() && steps.browser-diagnostics.outputs.created == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/field-browser-diagnostics.bin
          compression-level: 0

      - name: Clean up staging E2E fixtures
        if: always()
        uses: ./.github/actions/cleanup-staging-e2e
        with:
          handoff-artifact-id: ${{ needs.prepare-staging-e2e.outputs.handoff-artifact-id }}
        env:
          STAGING_E2E_HANDOFF_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}

  deploy-staging:
    name: Required checks and staging release gate
    needs: [preflight, flutter, android-builds, flutter-ios, referee, broadcaster, database, backend-staging, prepare-staging-e2e, android-staging-e2e, browser-staging-e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      # This gate has no staging secrets or protected environment. It cannot
      # require another deployment approval just to report an earlier failure.
      - name: Require every planned check to pass
        env:
          CI_PLAN: ${{ toJSON(needs.preflight.outputs) }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-results.mjs

  record-staging:
    name: Record verified staging release
    needs: [preflight, deploy-staging]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging' &&
      needs.preflight.outputs.release == 'true' &&
      needs.deploy-staging.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      # Never check out PR-controlled code in a job with a deployment-write token.
      - name: Record successful staging deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment_payload="$(
            jq -n \
              --arg ref "$GITHUB_SHA" \
              '{
                ref: $ref,
                environment: "staging",
                description: "Field staging Supabase deployment",
                auto_merge: false,
                required_contexts: [],
                transient_environment: false,
                production_environment: false
              }'
          )"
          deployment_id="$(
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              --input - \
              --jq '.id' <<<"$deployment_payload"
          )"
          status_payload="$(
            jq -n \
              '{
                state: "success",
                description: "Migrations, smoke, Android, referee, and admin E2E passed",
                environment: "staging",
                auto_inactive: false
              }'
          )"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --input - <<<"$status_payload" >/dev/null

  upload-testflight-staging:
    name: Upload staging build to TestFlight
    needs: record-staging
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging' &&
      needs.record-staging.result == 'success'
    runs-on: macos-26
    timeout-minutes: 45
    environment:
      name: staging
    env:
      FIELD_ENVIRONMENT: staging
      SUPABASE_URL: https://${{ vars.STAGING_SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_MERCHANT_ID: merchant.com.alialtaraif.fieldrush
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      IOS_STAGING_BUNDLE_ID: ${{ vars.IOS_STAGING_BUNDLE_ID }}
      TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Require Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/^Xcode / {split($2, version, "."); print version[1]}')"
          if [[ -z "$xcode_major" || "$xcode_major" -lt 26 ]]; then
            echo "::error::TestFlight uploads require Xcode 26 or newer."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Build, sign, and upload Field Staging
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_STAGING_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_STAGING_PROVISIONING_PROFILE_BASE64 }}
        run: .github/scripts/upload-staging-testflight.sh

      - name: Upload TestFlight failure diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-testflight-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: mobile/build/testflight-artifacts/

  deploy-referee-staging:
    name: Deploy Field Ops staging PWA
    needs: record-staging
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging' &&
      needs.record-staging.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://ops-staging.field.bh
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (Node 24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: referee/package-lock.json

      - name: Deploy and verify Field Ops Staging
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: .github/scripts/deploy-referee-staging.sh
